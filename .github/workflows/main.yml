name: Deploy static content to Pages

on:
  push:
    branches: ['staging']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output # Crucial debugging step
        run: |
          echo "Checking build output..."
          ls -l ./dist  # Or whatever your build output directory is.  "./dist" is common.
          tree ./dist  # This will give you a tree view of the directory structure. VERY helpful!

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' #  Correct: The path to the directory containing your built website
          # name: github-pages  # Optional:  Only needed if you want a custom artifact name.  Usually, the default "github-pages" is fine.

      - name: Deploy to GitHub Pages
        id: deployment
        uses:
          actions/deploy-pages@v3
          # artifact_name: github-pages  #  Usually not needed.  Defaults to "github-pages"
